# ============================================================
# MeituEcomAgent - Docker Compose 编排配置
# ============================================================
# 启动: docker-compose up -d
# 停止: docker-compose down
# 查看日志: docker-compose logs -f api
# ============================================================

services:
  # ========== ChromaDB 向量数据库 ==========
  chromadb:
    image: chromadb/chroma:latest
    container_name: meitu-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      # 持久化向量数据
      - chromadb_data:/chroma/chroma
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
    #   interval: 15s
    #   timeout: 5s
    #   start_period: 20s
    #   retries: 3
    networks:
      - meitu-network

  # ========== FastAPI 应用 ==========
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meitu-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      # ---- rembg 模型缓存目录 ----
      - U2NET_HOME=/app/.u2net
    volumes:
      # 挂载规则文件（只读）
      - ./knowledge_base:/app/knowledge_base:ro
      # 持久化 RAG 向量索引
      - rag_index_data:/app/knowledge_base_index
      # 挂载 ComfyUI 工作流文件
      - ./workflows:/app/workflows:ro
      # 持久化生成的图片和报告
      - output_data:/app/output
    depends_on:
      - chromadb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - meitu-network

# ============================================================
# 数据卷
# ============================================================
volumes:
  # ChromaDB 向量数据持久化
  chromadb_data:
    driver: local
  # RAG 向量索引持久化
  rag_index_data:
    driver: local
  # 生成的图片和报告持久化
  output_data:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  meitu-network:
    driver: bridge
