# ============================================================
# MeituEcomAgent - Docker Compose 编排配置
# ============================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f api
# ============================================================
# 注意: ChromaDB 使用嵌入式模式 (chromadb Python 包内置 PersistentClient)，
# 无需独立的 chromadb/chroma 容器。
# ============================================================

services:
  # ========== FastAPI 应用 ==========
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meitu-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      # ---- rembg 模型缓存目录 ----
      - U2NET_HOME=/app/.u2net
    volumes:
      # 挂载规则文件（只读）
      - ./knowledge_base:/app/knowledge_base:ro
      # 持久化 RAG 向量索引
      - rag_index_data:/app/knowledge_base_index
      # 挂载应用代码（开发模式：改代码即时生效，无需重建）
      - ./app:/app/app
      # 挂载 ComfyUI 工作流文件
      - ./workflows:/app/workflows:ro
      # 持久化生成的图片和报告
      - output_data:/app/output
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - meitu-network

# ============================================================
# 数据卷
# ============================================================
volumes:
  # RAG 向量索引持久化
  rag_index_data:
    driver: local
  # 生成的图片和报告持久化
  output_data:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  meitu-network:
    driver: bridge
