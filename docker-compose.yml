# ============================================================
# MeituEcomAgent - Docker Compose 编排配置
# ============================================================
# 生产启动: docker compose up -d
# 本地 ComfyUI/dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f api
# ============================================================
# 注意: ChromaDB 使用嵌入式模式 (chromadb Python 包内置 PersistentClient)，
# 无需独立的 chromadb/chroma 容器。
# ============================================================

services:
  # ========== FastAPI 应用 ==========
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meitu-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-cloud}
      - ENABLE_LOCAL_PREPROCESSING=${ENABLE_LOCAL_PREPROCESSING:-false}
      - RAG_PERSIST_DIR=/app/.data/knowledge_base_index
      - OUTPUT_DIR=/app/output
      - LOG_FILE=/app/logs/app.log
      - U2NET_HOME=/app/.data/u2net
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
      - ./.data/knowledge_base_index:/app/.data/knowledge_base_index
      - ./output:/app/output
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - meitu-network

# ============================================================
# 网络
# ============================================================
networks:
  meitu-network:
    driver: bridge
